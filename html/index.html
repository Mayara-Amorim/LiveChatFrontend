<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de Chat</title>
     <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
     <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div id="chat-container"></div>
    
    <div id="chatbox">
        <header id="chatbox-cabecalho">
            <span id="chatbox-titulo">AVA CHAT</span>
            <div class="chatbox-acoes">
                <button id="chatbox-minimizar" title="Minimizar"><i class="fas fa-minus"></i></button>
                <button id="chatbox-maximizar" title="Maximizar"><i class="fas fa-expand"></i></button>
            </div>
        </header>
        <div id="chatbox-corpo"></div>
    </div>
    
    <button id="btn-abrir-chatbox" title="Chat Box"><i class="fa-solid fa-down-left-and-up-right-to-center"></i></button>
    
    <div id="templates" style="display: none;">
    
        <div id="painel-lista-conversas"> 
            <div id="estilo-cabecalho">
                <header class="cabecalho-principal">
                
                    <div class="usuario-logado">
                        <div class="avatar" data-nome="Professor 001"></div>
                        <h2 id="titulo-cabecalho">Professor 001</h2>
                        <input type="text" id="input-busca" placeholder="Buscar conversas..." class="form-control d-none">
                    </div>
                    <div class="acoes-cabecalho">
                        <i id="icone-busca" class="fas fa-search"></i>
                        <button id="btn-minimizar-maximizado" title="Minimizar para Chatbox">
                            <i class="fas fa-compress"></i>
                        </button>
                    </div>
               
                </header>
            
            <div class="navegacao-tabs">
                <button class="tab-link active" data-tab="chats">Chats</button>
                <button class="tab-link" data-tab="grupos">Grupos</button>
            </div>
        </div>
            <main id="lista-conversas" class="lista-rolavel">
                </main>
            <button id="botao-nova-conversa" class="botao-flutuante d-none">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <div id="painel-conversa">
            <header class="cabecalho-conversa">
                <button class="botao-voltar"><i class="fas fa-arrow-left"></i></button>
                <div class="contato-ativo">
                    <div id="avatar-contato-ativo" class="avatar" data-nome="" style="cursor: pointer;"></div>
                    <h3 id="nome-contato-ativo">Selecione uma conversa</h3>
                </div>
                <div class="acoes-conversa-cabecalho">
                </div>
            </header>
            <div id="area-mensagens-fixadas" class="lista-rolavel"></div>
            <main id="area-mensagens" class="lista-rolavel"></main>
            <footer class="area-input">
                <i class="fas fa-paperclip"></i>
                <input type="text" id="input-mensagem" placeholder="Digite uma mensagem...">
                <button id="botao-enviar"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>
    
   <div class="modal fade" id="modal-novo-grupo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Criar novo grupo</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="input-nome-grupo">Nome do grupo</label>
                    <input type="text" class="form-control" id="input-nome-grupo" placeholder="Digite o nome do grupo">
                </div>
                <div class="form-group">
                    <label for="input-descricao-grupo">Descrição (opcional)</label>
                    <textarea class="form-control" id="input-descricao-grupo" rows="2" placeholder="Descreva o propósito do grupo"></textarea>
                </div>

                <div id="membros-selecionados-preview" class="d-flex flex-wrap mb-2 p-2 border rounded" style="min-height: 50px;">
                    </div>

                <div id="accordion-contatos">
                    <div class="card">
                        <div class="card-header p-0" id="heading-contatos">
                            <h4 class="mb-0">
                                <button class="btn btn-link btn-block text-left collapsed" data-toggle="collapse" data-target="#collapse-contatos" aria-expanded="false" aria-controls="collapse-contatos">
                                    Adicionar Membros
                                </button>
                            </h4>
                        </div>

                        <div id="collapse-contatos" class="collapse" aria-labelledby="heading-contatos" data-parent="#accordion-contatos">
                            <div class="card-body">
                                <div class="input-group mb-3">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                                    </div>
                                    <input type="text" class="form-control" id="busca-contatos-novo-grupo" placeholder="Pesquisar contatos">
                                </div>
                                <ul id="lista-contatos-novo-grupo" class="list-group">
                                    </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="btn-criar-grupo" disabled>Criar Grupo</button>
            </div>
        </div>
    </div>
</div>

    <div class="modal fade" id="modal-info" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="modal-info-titulo">Informações</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="modal-info-corpo">
             </div>
        </div>
      </div>
    </div>

    <div id="menu-contexto-conversa" class="dropdown-menu"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="../js/script.js"></script>
</body>
</html>
